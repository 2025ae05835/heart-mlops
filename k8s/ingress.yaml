# Optional: expose through an NGINX Ingress instead of / in addition to the
# LoadBalancer. Minikube: `minikube addons enable ingress`, then add
# "<minikube ip> heart.local" to /etc/hosts (or use `minikube tunnel`).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-api
  namespace: heart
spec:
  ingressClassName: nginx
  rules:
    - host: heart.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-api
                port: {number: 80}

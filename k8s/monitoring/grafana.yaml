# Grafana with provisioned Prometheus datasource + Heart API dashboard.
# The dashboard ConfigMap is created from monitoring/grafana/dashboards/
# by scripts/deploy_k8s.sh (kubectl create configmap ... --from-file).
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning, namespace: heart}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.heart.svc:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: heart
        folder: Heart API
        type: file
        options: {path: /var/lib/grafana/dashboards}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: heart}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: prov, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml}
            - {name: prov, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: prov
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: heart}
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30300}]
